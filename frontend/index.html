<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salesforce Duplicate Detector</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="min-h-screen">
    <!-- Navigation -->
    <nav class="nav-blur-bg sticky top-0 z-30 border-b border-sand-dark">
        <div class="max-w-7xl mx-auto px-6">
            <div class="flex items-center h-14">
                <span class="font-serif text-xl font-medium tracking-tight text-charcoal mr-8">Duplicate Detector</span>
                <div class="flex gap-1">
                    <a href="#" class="nav-link nav-pill px-4 py-1.5 rounded-full text-sm font-medium nav-pill-active" data-view="dashboard">Dashboard</a>
                    <a href="#" class="nav-link nav-pill px-4 py-1.5 rounded-full text-sm font-medium text-slate-500 hover:text-charcoal hover:bg-sand" data-view="groups">Groups</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-6 pt-4">
        <div class="text-amber-800 bg-amber-50 border border-amber-200 rounded-lg px-4 py-3 text-sm">
            Read-only. Merge and set-parent are turned off and cannot update Salesforce. For a CSV review, open the browser app in the web folder.
        </div>
    </div>

    <!-- Main content -->
    <main class="max-w-7xl mx-auto px-6 py-8" id="main-content">
        <div class="flex justify-center py-12"><div class="spinner"></div></div>
    </main>

    <!-- Scripts (order matters) -->
    <script src="/js/api.js?v=4"></script>
    <script src="/js/components/filters.js?v=4"></script>
    <script src="/js/components/dashboard.js?v=4"></script>
    <script src="/js/components/group-list.js?v=4"></script>
    <script src="/js/components/group-detail.js?v=4"></script>
    <script src="/js/components/merge-wizard.js?v=4"></script>
    <script src="/js/app.js?v=4"></script>
</body>
</html>
