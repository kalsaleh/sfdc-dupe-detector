<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; worker-src 'self'; connect-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Duplicate review</title>
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div>
        <p class="brand">Duplicate review</p>
        <p class="brand-note">Read-only. The CSV stays in this browser.</p>
      </div>
      <p class="lock">No Salesforce writes</p>
    </div>
  </header>
  <main id="app" class="wrap"></main>
  <noscript>
    <p class="wrap">This review app needs JavaScript. It still does not send the file anywhere.</p>
  </noscript>
  <script type="module" src="./js/app.js"></script>

</html>
